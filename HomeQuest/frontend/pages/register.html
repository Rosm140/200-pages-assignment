<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – HomeQuest</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background:var(--off-white)">
<div id="page-loader"><div class="loader-logo">HomeQuest</div><div class="loader-bar"></div></div>
<div id="toast-container"></div>

<div class="auth-wrapper">
  <!-- Left Panel -->
  <div class="auth-left">
    <div style="position:relative;z-index:2">
      <a href="../index.html" class="nav-logo" style="margin-bottom:40px;display:flex">
        <div class="nav-logo-icon" style="background:rgba(255,255,255,0.2)">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        </div>
        <span style="color:white">HomeQuest</span>
      </a>
      <h2 style="font-size:2.2rem;margin-bottom:14px">Join HomeQuest Today</h2>
      <p>Create your free account and unlock access to thousands of premium verified properties across India.</p>
      <div style="margin-top:48px">
        <div style="background:rgba(255,255,255,0.1);border-radius:var(--radius-lg);padding:24px;margin-bottom:16px">
          <div style="font-size:2rem;font-weight:900;color:white;font-family:var(--font-display)">15,000+</div>
          <div style="color:rgba(255,255,255,0.75);font-size:0.9rem;margin-top:4px">Properties Available</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div style="background:rgba(255,255,255,0.1);border-radius:var(--radius-md);padding:16px;text-align:center">
            <div style="font-size:1.5rem;font-weight:700;color:white">8,200+</div>
            <div style="color:rgba(255,255,255,0.6);font-size:0.8rem">Happy Clients</div>
          </div>
          <div style="background:rgba(255,255,255,0.1);border-radius:var(--radius-md);padding:16px;text-align:center">
            <div style="font-size:1.5rem;font-weight:700;color:white">50+</div>
            <div style="color:rgba(255,255,255,0.6);font-size:0.8rem">Cities</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="auth-right">
    <div class="auth-box">
      <h3 class="auth-title">Create Account</h3>
      <p class="auth-sub">Already have an account? <a href="login.html" style="color:var(--primary);font-weight:600">Sign in</a></p>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="form-group" style="grid-column:1/-1">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="John Doe">
          <div class="form-error" id="err-name"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="you@example.com">
          <div class="form-error" id="err-email"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+91 XXXXX XXXXX">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div style="position:relative">
            <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 characters" style="padding-right:44px">
            <button onclick="togglePwd('reg-password',this)" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer"><i class="fas fa-eye"></i></button>
          </div>
          <div class="form-error" id="err-password"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div style="position:relative">
            <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat password" style="padding-right:44px">
            <button onclick="togglePwd('reg-confirm',this)" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer"><i class="fas fa-eye"></i></button>
          </div>
          <div class="form-error" id="err-confirm"></div>
        </div>
      </div>

      <!-- Password strength -->
      <div style="margin-bottom:16px">
        <div style="height:4px;background:var(--gray-200);border-radius:2px;overflow:hidden">
          <div id="pwd-strength-bar" style="height:100%;width:0;transition:all 0.3s;border-radius:2px"></div>
        </div>
        <div id="pwd-strength-text" style="font-size:0.75rem;color:var(--gray-400);margin-top:5px"></div>
      </div>

      <label style="display:flex;align-items:flex-start;gap:8px;margin-bottom:20px;font-size:0.85rem;color:var(--gray-600);cursor:pointer;line-height:1.5">
        <input type="checkbox" id="reg-terms" style="accent-color:var(--primary);margin-top:2px">
        I agree to HomeQuest's <a href="#" style="color:var(--primary)">Terms of Service</a> and <a href="#" style="color:var(--primary)">Privacy Policy</a>
      </label>

      <button class="btn btn-primary" style="width:100%;margin-bottom:16px" onclick="handleRegister()" id="reg-btn">
        <i class="fas fa-user-plus"></i> Create Account
      </button>

      <div style="text-align:center;color:var(--gray-400);font-size:0.82rem">
        <i class="fas fa-lock"></i> Your data is secure and never shared
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/main.js"></script>
<script>
function togglePwd(id, btn) {
  const input = document.getElementById(id);
  const isText = input.type === 'text';
  input.type = isText ? 'password' : 'text';
  btn.innerHTML = isText ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
}

document.getElementById('reg-password').addEventListener('input', function() {
  const val = this.value;
  const bar = document.getElementById('pwd-strength-bar');
  const text = document.getElementById('pwd-strength-text');
  if (val.length === 0) { bar.style.width='0'; text.textContent=''; return; }
  let strength = 0;
  if (val.length >= 6) strength++;
  if (/[A-Z]/.test(val)) strength++;
  if (/[0-9]/.test(val)) strength++;
  if (/[^A-Za-z0-9]/.test(val)) strength++;
  const levels = [
    { w:'25%', color:'#EF4444', label:'Weak' },
    { w:'50%', color:'#F59E0B', label:'Fair' },
    { w:'75%', color:'#06B6D4', label:'Good' },
    { w:'100%', color:'#10B981', label:'Strong' }
  ];
  const l = levels[strength - 1] || levels[0];
  bar.style.width = l.w; bar.style.background = l.color;
  text.textContent = `Password strength: ${l.label}`; text.style.color = l.color;
});

async function handleRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-password').value;
  const confirm = document.getElementById('reg-confirm').value;
  const terms = document.getElementById('reg-terms').checked;

  ['name','email','password','confirm'].forEach(f => document.getElementById(`err-${f}`).textContent = '');

  let valid = true;
  if (!name) { document.getElementById('err-name').textContent = 'Name is required'; valid = false; }
  if (!email || !email.includes('@')) { document.getElementById('err-email').textContent = 'Valid email required'; valid = false; }
  if (password.length < 6) { document.getElementById('err-password').textContent = 'Min. 6 characters'; valid = false; }
  if (password !== confirm) { document.getElementById('err-confirm').textContent = 'Passwords do not match'; valid = false; }
  if (!terms) { showToast('Please accept the Terms of Service', 'error'); valid = false; }
  if (!valid) return;

  const btn = document.getElementById('reg-btn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
  btn.disabled = true;

  try {
    const data = await apiFetch('/auth/register', {
      method: 'POST',
      body: JSON.stringify({ name, email, password, phone })
    });
    Auth.save(data.token, data.user);
    showToast('🎉 Account created successfully! Welcome to HomeQuest!', 'success');
    setTimeout(() => window.location.href = 'user-dashboard.html', 1200);
  } catch (err) {
    // Demo fallback
    Auth.save('demo-token', { name, email, role: 'user', id: 'new1' });
    showToast('🎉 Welcome to HomeQuest, ' + name + '!', 'success');
    setTimeout(() => window.location.href = 'user-dashboard.html', 1200);
  }
}
</script>
</body>
</html>
